services:
  linkwarden:
    container_name: linkwarden
    labels:
      caddy: "https://links.kloud.home.kg"
      caddy.reverse_proxy: "{{upstreams 3000}}"
      caddy_ingress_network: "proxy"
    image: ghcr.io/linkwarden/linkwarden:latest
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - backend
      - proxy
    user: 1000:100
    env_file: .env
    volumes:
      - /mnt/sata_500/linkwarden/data:/data/data
    depends_on:
      - meilisearch

  meilisearch:
    image: getmeili/meilisearch:v1.12.8
    restart: unless-stopped
    user: 1000:100
    env_file: .env
    volumes:
      - /mnt/sata_500/linkwarden/meili_data:/meili_data

networks:
  proxy:
    external: true
    name: proxy
  backend:
    external: true
    name: backend
