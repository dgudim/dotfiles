name: monitoring
services:
    grafana:
        image: grafana/grafana
        container_name: grafana
        user: 1000:100
        restart: unless-stopped
        network_mode: host
        environment:
            - GF_SERVER_HTTP_PORT=3003
            - GF_SERVER_DOMAIN=grafana.kloud.home
            - GF_SECURITY_ALLOW_EMBEDDING=true 
            - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/api/ingress/grafana/
            - GF_SERVER_SERVE_FROM_SUB_PATH=true
            - GF_SECURITY_ALLOW_EMBEDDING=true
            - GF_AUTH_PROXY_ENABLED=true
            - GF_AUTH_PROXY_HEADER_NAME=X-WEBAUTH-USER
            - GF_AUTH_PROXY_HEADER_PROPERTY=username
            - TZ=Europe/Vilnius
        volumes:
            - /mnt/sata_500/grafana:/var/lib/grafana

    victoria-logs:
        image: docker.io/victoriametrics/victoria-logs:latest
        container_name: victoria-logs
        command: -storageDataPath=/victoria-logs-data -retentionPeriod=5y
        user: 1000:100
        restart: unless-stopped
        environment:
            - TZ=Europe/Vilnius
        ports:
            - 9428:9428
        volumes:
            - /mnt/sata_500/victoria/logs:/victoria-logs-data

    victoria-metrics:
        image: victoriametrics/victoria-metrics:latest
        container_name: victoria-metrics
        command: -storageDataPath=/victoria-metrics-data -retentionPeriod=5y -promscrape.config=/etc/vm/scrape-config.yml
        user: 1000:100
        restart: unless-stopped
        environment:
            - TZ=Europe/Vilnius
        ports:
            - 8428:8428
        extra_hosts:
            - host.docker.internal:host-gateway
        volumes:
            - /mnt/sata_500/victoria/metrics:/victoria-metrics-data
            - /mnt/sata_500/victoria/scrape-config.yml:/etc/vm/scrape-config.yml:ro
    netdata:
        image: netdata/netdata:stable
        container_name: netdata
        pid: host
        network_mode: host
        restart: unless-stopped
        environment:
            - TZ=Europe/Vilnius
        cap_add:
            - SYS_PTRACE
            - SYS_ADMIN
        security_opt:
            - apparmor:unconfined
        volumes:
            - /mnt/sata_500/netdata/config:/etc/netdata
            - /mnt/sata_500/netdata/lib:/var/lib/netdata
            - /:/host/root:ro,rslave
            - /etc/passwd:/host/etc/passwd:ro
            - /etc/group:/host/etc/group:ro
            - /etc/localtime:/etc/localtime:ro
            - /proc:/host/proc:ro
            - /sys:/host/sys:ro
            - /etc/os-release:/host/etc/os-release:ro
            - /var/log:/host/var/log:ro
            - /var/run/docker.sock:/var/run/docker.sock:ro
            # - /home/kloud/netdata/web:/usr/share/netdata/web:ro
        tmpfs:
            - /var/cache/netdata:uid=201,gid=201,mode=0770,size=268435456

    # Scrutiny's web UI queries InfluxDB with Flux. Can't use Victoria Metrics :(
    scrutiny-influxdb:
        image: influxdb:2.9        
        container_name: scrutiny-influxdb
        restart: unless-stopped
        environment:
            - TZ=Europe/Vilnius
            - INFLUXD_USE_HASHED_TOKENS=false
        volumes:
            - /mnt/sata_500/scrutiny_influxdb2:/var/lib/influxdb2
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 20s

    scrutiny-web:
        image: ghcr.io/starosdev/scrutiny:latest-web
        container_name: scrutiny-web
        restart: unless-stopped
        ports:
            - 4040:8080
        volumes:
            - /mnt/sata_500/scrutiny:/opt/scrutiny/config
        environment:
            - TZ=Europe/Vilnius
            - SCRUTINY_WEB_INFLUXDB_HOST=scrutiny-influxdb
            - SCRUTINY_WEB_INFLUXDB_PORT=8086
        depends_on:
            scrutiny-influxdb:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
            interval: 15s
            timeout: 5s
            retries: 8
            start_period: 20s

    scrutiny-collector:
        image: ghcr.io/starosdev/scrutiny:latest-collector
        container_name: scrutiny-collector
        restart: unless-stopped
        cap_add:
            - SYS_RAWIO
            - SYS_ADMIN
        devices:
            - /dev/sda
            - /dev/sdb
        volumes:
            - /run/udev:/run/udev:ro
        environment:
            - TZ=Europe/Vilnius
            - COLLECTOR_COMMANDS_METRICS_SMART_ARGS=--xall --json -n standby
            - COLLECTOR_API_ENDPOINT=http://scrutiny-web:8080
            - COLLECTOR_HOST_ID=microchelik
            - COLLECTOR_RUN_STARTUP=true
            - COLLECTOR_CRON_SCHEDULE=*/30 * * * *
        depends_on:
            scrutiny-web:
                condition: service_healthy

    dockhand:
        image: fnsys/dockhand:latest
        container_name: dockhand
        restart: unless-stopped
        user: 1000:100
        ports:
            - 3040:3000
        environment:
            - TZ=Europe/Vilnius
        group_add:
            - 468 # Docker group for socket access
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - /mnt/sata_500/dockhand:/app/data
            - /home/kloud:/home/kloud
            - /mnt/sata_500:/mnt/sata_500


