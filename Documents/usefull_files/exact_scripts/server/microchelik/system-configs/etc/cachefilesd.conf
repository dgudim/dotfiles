# brun - Stop caching at 30% free space left
# bcull - Start culling at 21%
# bstop - Stop caching at 9% left
# f* - same for files
dir /mnt/sata_500/fscache
tag mycache
brun 30%
bcull 21%
bstop 9%
frun 30%
fcull 21%
fstop 9%
# Assuming you're using SELinux with the default security policy included in
# this package
#secctx system_u:system_r:cachefiles_kernel_t:s0

