# Secrets come from .env
x-ttrss-env: &ttrss-env
  OWNER_UID: ${PUID}
  # not ${PGID}: 100 is the users group in the Alpine 
  OWNER_GID: "1000"
  TTRSS_DB_HOST: "postgres"
  TTRSS_DB_USER: "ttrss"
  TTRSS_DB_NAME: "ttrss"
  TTRSS_DB_PASS: ${TTRSS_DB_PASS}

services:
  tt-rss-app:
    image: supahgreg/tt-rss:latest
    container_name: tt-rss-app
    restart: unless-stopped
    networks:
      - default
      - backend
    environment:
      <<: *ttrss-env
      ADMIN_USER_PASS: ${ADMIN_USER_PASS}
      # -2 forbidden, -1 read-only, 0 user, 10 admin
      ADMIN_USER_ACCESS_LEVEL: "10"
      AUTO_CREATE_USER: "kloud"
      AUTO_CREATE_USER_PASS: ${AUTO_CREATE_USER_PASS}
      AUTO_CREATE_USER_ACCESS_LEVEL: "0"
    volumes:
      - /mnt/sata_500/rss/tt-rss/app:/var/www/html
      - /mnt/sata_500/rss/tt-rss/config.d:/opt/tt-rss/config.d:ro

  tt-rss-updater:
    image: supahgreg/tt-rss:latest
    container_name: tt-rss-updater
    restart: unless-stopped
    networks:
      - default
      - backend
    environment: *ttrss-env
    volumes:
      - /mnt/sata_500/rss/tt-rss/app:/var/www/html
      - /mnt/sata_500/rss/tt-rss/config.d:/opt/tt-rss/config.d:ro
    depends_on:
      - tt-rss-app
    command: /opt/tt-rss/updater.sh


  tt-rss-nginx:
    image: supahgreg/tt-rss-web-nginx:latest
    container_name: tt-rss-nginx
    labels:
      homepage.group: "Public"
      homepage.name: "Tiny Tiny RSS"
      homepage.icon: "tinytinyrss.png"
      homepage.href: "${TTRSS_URL}"
      homepage.description: "Feeds"
      homepage.weight: "50"
      caddy: "${TTRSS_URL}"
      caddy.shield: ""
      caddy.log: access
      caddy.reverse_proxy: "{{upstreams 80}}"
      caddy_ingress_network: "proxy"
    restart: unless-stopped
    environment:
      APP_UPSTREAM: "tt-rss-app"
    volumes:
      - /mnt/sata_500/rss/tt-rss/app:/var/www/html:ro
    depends_on:
      - tt-rss-app
    networks:
      - default
      - proxy

  rsshub:
    image: diygod/rsshub:chromium-bundled
    container_name: rsshub
    restart: unless-stopped
    networks:
      - default
      - backend
    environment:
      - NODE_ENV=production
      - CACHE_TYPE=redis
      - REDIS_URL=redis://valkey:6379/
      - PORT=80
      - CACHE_EXPIRE=3600          # 1 Hour
      - CACHE_CONTENT_EXPIRE=18000 # 5 hours
      - TWITTER_AUTH_TOKEN=${RSSHUB_TWITTER_AUTH_TOKEN}

    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:80/healthz']
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  proxy:
    external: true
    name: proxy
  backend:
    external: true
    name: backend
