services:

    bentopdf:
        image: ghcr.io/alam00000/bentopdf-simple:latest
        container_name: bentopdf
        labels:
          homepage.group: "Internal apps"
          homepage.name: "BentoPDF"
          homepage.icon: "mdi-file-pdf-box"
          homepage.href: "${BENTOPDF_URL}"
          homepage.description: "PDF tools"
          homepage.weight: "10"
          caddy: "${BENTOPDF_SITES}"
          caddy.log: access
          caddy.reverse_proxy: "{{upstreams 8080}}"
          caddy_ingress_network: "proxy"
        restart: unless-stopped
        networks:
          - default
          - proxy

    homepage:
        image: ghcr.io/gethomepage/homepage:latest
        container_name: homepage
        labels:
          caddy: "${HOMEPAGE_SITES}"
          caddy.log: access
          caddy.reverse_proxy: "{{upstreams 3000}}"
          caddy_ingress_network: "proxy"
        restart: unless-stopped
        healthcheck:
            interval: 60s
        user: ${PUID}:${PGID}
        environment:
            - TZ=${TZ}
            - HOMEPAGE_ALLOWED_HOSTS=${DOMAIN_LAN},${DOMAIN_VPN},${SERVER_LAN_IP}:3333,${SERVER_VPN_IP}:3333
            - PUID=${PUID}
            - PGID=${PGID}
            - LOG_TARGETS=stdout
            # For {{HOMEPAGE_VAR_...}} in services.yaml
            - HOMEPAGE_VAR_NEXTCLOUD_AIO_URL=${NEXTCLOUD_AIO_TLS_URL}
            - HOMEPAGE_VAR_ROUTER_URL=${ROUTER_URL}
            - HOMEPAGE_VAR_NEXTCLOUD_URL=${NEXTCLOUD_URL}
        group_add:
            - 468 # Docker group for socket access
        volumes:
            - ./config/homepage:/app/config
            - /var/run/docker.sock:/var/run/docker.sock:ro
        extra_hosts:
            - "host.docker.internal:host-gateway"
        networks:
            - default
            - base
            - booklore
            - media
            - monitoring
            - neko
            - rss
            - proxy

    languagetool:
        image: erikvl87/languagetool:latest
        container_name: languagetool
        labels:
          caddy: "${LANGUAGETOOL_URL}"
          caddy.import: protect
          caddy.log: access
          caddy.reverse_proxy: "{{upstreams 8010}}"
          caddy_ingress_network: "proxy"
        restart: unless-stopped
        healthcheck:
            interval: 60s
        user: ${PUID}:${PGID}
        environment:
            - TZ=${TZ}
            - Java_Xms=512m
            - Java_Xmx=2g
            - langTool_abTest=
            - langTool_abTestClients=
            - langtool_pipelinePrewarming=true
            - langtool_languageModel=/ngrams
        volumes:
            - /mnt/sata_500/languagetool/ngrams:/ngrams:ro
            - ./config/languagetool/logback.xml:/LanguageTool/logback.xml
        networks:
          - default
          - proxy


    ntfy:
        image: binwiederhier/ntfy
        container_name: ntfy
        user: ${PUID}:${PGID}
        labels:
          homepage.group: "Public"
          homepage.name: "ntfy"
          homepage.icon: "ntfy.png"
          homepage.href: "${NTFY_URL}"
          homepage.description: "Notifications"
          homepage.weight: "60"
          caddy: "${NTFY_URL}"
          caddy.import: protect
          caddy.log: access
          caddy.reverse_proxy: "{{upstreams 81}}"
          caddy_ingress_network: "proxy"
        command: serve
        restart: unless-stopped
        environment:
            TZ: ${TZ}
            NTFY_BASE_URL: ${NTFY_URL}
            NTFY_LISTEN_HTTP: ":81"
            NTFY_BEHIND_PROXY: "true"
            NTFY_PROXY_FORWARDED_HEADER: X-Forwarded-For
            NTFY_WEB_ROOT: /
            NTFY_KEEPALIVE_INTERVAL: 45s
            NTFY_MANAGER_INTERVAL: 5m
            NTFY_ENABLE_METRICS: "false"
            # Users, tokens, access and message cache
            NTFY_DATABASE_URL: postgres://ntfy:${NTFY_DB_PASS}@postgres:5432/ntfy?sslmode=disable
            NTFY_CACHE_DURATION: 24h
            # Auth
            NTFY_AUTH_DEFAULT_ACCESS: write-only
            NTFY_AUTH_USERS: ${NTFY_AUTH_USERS}
            NTFY_AUTH_TOKENS: ${NTFY_AUTH_TOKENS}
            NTFY_ENABLE_SIGNUP: "false"
            NTFY_REQUIRE_LOGIN: "true"
            NTFY_ENABLE_LOGIN: "true"
            NTFY_ENABLE_RESERVATIONS: "true"
            # Attachments
            NTFY_ATTACHMENT_CACHE_DIR: /var/cache/ntfy/attachments
            NTFY_ATTACHMENT_TOTAL_SIZE_LIMIT: 5G
            NTFY_ATTACHMENT_FILE_SIZE_LIMIT: 100M
            NTFY_ATTACHMENT_EXPIRY_DURATION: 12h
            NTFY_TEMPLATE_DIR: /etc/ntfy-templates
            # Incoming e-mail
            NTFY_SMTP_SERVER_LISTEN: ":8025"
            NTFY_SMTP_SERVER_DOMAIN: ${DOMAIN_LAN}
        ports:
            # SMTP
            - 8025:8025
        volumes:
            - /mnt/sata_500/ntfy/cache:/var/cache/ntfy
            - ./config/ntfy/templates:/etc/ntfy-templates:ro
        networks:
          - default
          - backend
          - proxy

    syncthing:
        image: syncthing/syncthing:latest
        container_name: syncthing
        labels:
          homepage.group: "Infra"
          homepage.name: "Syncthing"
          homepage.icon: "syncthing.png"
          homepage.href: "${SYNCTHING_URL}"
          homepage.description: "File sync"
          homepage.weight: "70"
          caddy: "${SYNCTHING_SITES}"
          caddy.log: access
          caddy.reverse_proxy: "127.0.0.1:8384"
        restart: unless-stopped
        hostname: microchelik
        environment:
            - PUID=${PUID}
            - PGID=${PGID}
            - PCAP=cap_chown,cap_fowner+ep
            - STGUIADDRESS=
            - UMASK=027 # https://wintelguy.com/umask-calc.pl
            - TZ=${TZ}
        network_mode: host # 22000, 22001, 22027, 8384
        volumes:
            - /mnt/sata_500/syncthing:/var/syncthing
            - /mnt/sata_500/syncthing/config:/var/syncthing/config
            - chonker-music:/var/syncthing/data/music
        healthcheck:
            interval: 5m

    syncthing-relay:
        image: syncthing/relaysrv
        container_name: syncthing-relay
        hostname: microchelik-relay
        environment:
          - PUID=${PUID}
          - PGID=${PGID}
        network_mode: host # 22067, 22070 for stats
        restart: unless-stopped
        entrypoint: ["/bin/entrypoint.sh", "/bin/strelaysrv", "-pools", "", "-provided-by=", "kloud's homelab"]
        volumes:
          - /mnt/sata_500/syncthing/relay:/var/strelaysrv

    goatcounter:
        image: arp242/goatcounter
        container_name: goatcounter
        labels:
          homepage.group: "Public"
          homepage.name: "GoatCounter"
          homepage.icon: "mdi-chart-bar"
          homepage.href: "${GOATCOUNTER_URL}"
          homepage.description: "Page views"
          homepage.weight: "100"
          caddy: "${GOATCOUNTER_URL}"
          caddy.import: protect
          caddy.log: access
          caddy.reverse_proxy: "{{upstreams 8080}}"
          caddy_ingress_network: "proxy"
        restart: unless-stopped
        user: ${PUID}:${PGID}
        environment:
            - TZ=${TZ}
            - GOATCOUNTER_DB=postgresql+postgresql://goatcounter:${GOATCOUNTER_DB_PASS}@postgres:5432/goatcounter?sslmode=disable
        volumes:
            # GeoIP database and export temp files only, the data is in Postgres
            - /mnt/sata_500/goatcounter:/home/goatcounter/goatcounter-data
        networks:
          - default
          - backend
          - proxy

    spoolman:
      image: ghcr.io/donkie/spoolman:latest
      container_name: spoolman
      labels:
        homepage.group: "Home"
        homepage.name: "Spoolman"
        homepage.icon: "spoolman.png"
        homepage.href: "${SPOOLMAN_URL}"
        homepage.description: "Filament management"
        homepage.weight: "40"
        caddy: "${SPOOLMAN_SITES}"
        caddy.log: access
        caddy.reverse_proxy: "{{upstreams 8000}}"
        caddy_ingress_network: "proxy"
      restart: unless-stopped
      volumes:
        - type: bind
          source: /mnt/sata_500/spoolman
          target: /home/app/.local/share/spoolman
      environment:
        - TZ=${TZ}
        - PUID=${PUID}
        - PGID=${PGID}
        - SPOOLMAN_DIR_LOGS=/tmp/spoolman-logs
        - SPOOLMAN_DB_TYPE=postgres
        - SPOOLMAN_DB_HOST=postgres
        - SPOOLMAN_DB_PORT=5432
        - SPOOLMAN_DB_NAME=spoolman
        - SPOOLMAN_DB_USERNAME=spoolman
        - SPOOLMAN_DB_PASSWORD=${SPOOLMAN_DB_PASS}
      tmpfs:
        - /tmp/spoolman-logs:uid=${PUID},gid=${PGID},mode=0755
      networks:
        - default
        - backend
        - proxy

    atuin:
        image: ghcr.io/atuinsh/atuin:18.23.0
        container_name: atuin
        labels:
          caddy: "${ATUIN_URL}"
          caddy.import: protect
          caddy.log: access
          caddy.reverse_proxy: "{{upstreams 8888}}"
          caddy_ingress_network: "proxy"
        restart: unless-stopped
        healthcheck:
            interval: 60s
        networks:
            - default
            - backend
            - proxy
        command: start
        user: ${PUID}:${PGID}
        volumes:
          - ./config/atuin:/config
        environment:
          ATUIN_HOST: "0.0.0.0"
          ATUIN_OPEN_REGISTRATION: "true"
          ATUIN_DB_URI: ${ATUIN_DB_URI}
          RUST_LOG: info

    plik:
        image: rootgg/plik:latest
        container_name: plik
        labels:
          homepage.group: "Public"
          homepage.name: "Plik"
          homepage.icon: "mdi-cloud-upload"
          homepage.href: "${PLIK_URL}"
          homepage.description: "File drop"
          homepage.weight: "80"
          caddy: "${PLIK_URL}"
          caddy.import: protect
          caddy.log: access
          caddy.reverse_proxy: "{{upstreams 8080}}"
          caddy_ingress_network: "proxy"
        restart: "unless-stopped"
        user: ${PUID}:${PGID}
        environment:
          PLIKD_LISTEN_PORT: "8080"
          PLIKD_PLIK_DOMAIN: ${PLIK_URL}
          PLIKD_SOURCE_IP_HEADER: X-Forwarded-For
          PLIKD_MAX_FILE_SIZE_STR: 25GB
          PLIKD_MAX_FILE_PER_UPLOAD: "10000"
          PLIKD_DEFAULT_TTL_STR: 15d
          PLIKD_MAX_TTL_STR: 30d
          PLIKD_FEATURE_EXTEND_TTL: default
          PLIKD_FEATURE_AUTHENTICATION: enabled
          PLIKD_FEATURE_COMMENTS: default
          PLIKD_FEATURE_GITHUB: disabled
          PLIKD_DEFAULT_ADMIN_LOGIN: kloud-admin
          PLIKD_DEFAULT_ADMIN_PASSWORD: ${PLIK_ADMIN_PASSWORD}
          PLIKD_DATA_BACKEND: file
          PLIKD_DATA_BACKEND_CONFIG: '{"Directory":"/data/files"}'
          PLIKD_METADATA_BACKEND_CONFIG: '{"Driver":"postgres","ConnectionString":"postgres://plik:${PLIK_DB_PASS}@postgres:5432/plik?sslmode=disable","Debug":false}'
        volumes:
          - /mnt/sata_500/plik/data:/data
        networks:
          - default
          - backend
          - proxy

    linkwarden:
      container_name: linkwarden
      labels:
        homepage.group: "Public"
        homepage.name: "Linkwarden"
        homepage.icon: "linkwarden.png"
        homepage.href: "${LINKWARDEN_URL}"
        homepage.description: "Bookmarks"
        homepage.weight: "20"
        caddy: "${LINKWARDEN_URL}"
        caddy.import: protect
        caddy.log: access
        caddy.reverse_proxy: "{{upstreams 3000}}"
        caddy_ingress_network: "proxy"
      image: ghcr.io/linkwarden/linkwarden:latest
      restart: unless-stopped
      healthcheck:
          interval: 60s
      networks:
        - default
        - backend
        - proxy
      user: ${PUID}:${PGID}
      environment:
        NEXTAUTH_URL: "${LINKWARDEN_URL}/api/v1/auth"
        NEXTAUTH_SECRET: ${LINKWARDEN_NEXTAUTH_SECRET}
        DATABASE_URL: ${LINKWARDEN_DATABASE_URL}
        MEILI_MASTER_KEY: ${LINKWARDEN_MEILI_MASTER_KEY}
        NEXT_PUBLIC_OLLAMA_ENDPOINT_URL: "http://host.docker.internal:11434"
        OLLAMA_MODEL: "phi3:mini-4k"
      volumes:
        - /mnt/sata_500/linkwarden/data:/data/data
      depends_on:
        - meilisearch

    meilisearch:
      image: getmeili/meilisearch:v1.12.8
      restart: unless-stopped
      user: ${PUID}:${PGID}
      environment:
        MEILI_MASTER_KEY: ${LINKWARDEN_MEILI_MASTER_KEY}
      volumes:
        - /mnt/sata_500/linkwarden/meili_data:/meili_data

    kitchenowl:
      image: tombursch/kitchenowl:latest
      restart: unless-stopped
      container_name: kitchenowl
      labels:
        homepage.group: "Public"
        homepage.name: "KitchenOwl"
        homepage.icon: "kitchenowl.png"
        homepage.href: "${KITCHENOWL_URL}"
        homepage.description: "Groceries"
        homepage.weight: "40"
        caddy: "${KITCHENOWL_URL}"
        caddy.import: protect
        caddy.log: access
        caddy.reverse_proxy: "{{upstreams 8080}}"
        caddy_ingress_network: "proxy"
      user: ${PUID}:${PGID}
      environment:
        - JWT_SECRET_KEY=${KITCHENOWL_JWT_SECRET_KEY}
        - DB_DRIVER=postgresql
        - DB_HOST=postgres
        - DB_PORT=5432
        - DB_NAME=kitchenowl
        - DB_USER=kitchenowl
        - DB_PASSWORD=${KITCHENOWL_DB_PASS}
      volumes:
        - /mnt/sata_500/kitchenowl:/data
      networks:
        - default
        - backend
        - proxy

volumes:
  chonker-music:
    external: true
    name: chonker-music


networks:
  proxy:
    external: true
    name: proxy
  backend:
    external: true
    name: backend
  base:
    external: true
    name: base_default
  booklore:
    external: true
    name: booklore_default
  media:
    external: true
    name: media_default
  monitoring:
    external: true
    name: monitoring_default
  neko:
    external: true
    name: neko_default
  rss:
    external: true
    name: rss_default
