services:
  caddy:
    build:
      context: .
      dockerfile: Caddy.Dockerfile
    container_name: caddy
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - CADDY_INGRESS_NETWORKS=proxy
      # Reject an invalid Caddyfile as a whole instead of dropping blocks
      - CADDY_DOCKER_PROCESS_CADDYFILE=false
      # For {$...} in the Caddyfile
      - DNS_HOST=${DNS_HOST}
      - NEXTCLOUD_URL=${NEXTCLOUD_URL}
      - ROUTER_SITES=${ROUTER_SITES}
      - ROUTER_IP=${ROUTER_IP}
      - CROWDSEC_BOUNCER_KEY=${CROWDSEC_BOUNCER_KEY}
    cap_add:
      - NET_ADMIN
    network_mode: host
    volumes:
      - ./config/caddy:/etc/caddy
      - /mnt/sata_500/caddy/data:/data/caddy
      - /mnt/sata_500/caddy/temp_conf:/config/caddy
      - caddy-access:/var/log/caddy
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /mnt/sata_500/vector/geoip:/geoip:ro # GeoLite2 for geoblocking

  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: microchelik
    restart: unless-stopped
    network_mode: host
    environment:
#      - TS_AUTHKEY=
      - TS_EXTRA_ARGS=--accept-dns=true --operator=root
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TZ=${TZ}
    cap_add:
      - NET_ADMIN
    volumes:
      - /mnt/sata_500/tailscale:/var/lib/tailscale
      - /run/dbus:/run/dbus
      - /etc/resolv.conf:/etc/resolv.conf
    devices:
      - /dev/net/tun

  pihole:
    container_name: pihole
    labels:
      homepage.group: "Infra"
      homepage.name: "Pi-hole"
      homepage.icon: "pi-hole.png"
      homepage.href: "${PIHOLE_URL}"
      homepage.description: "DNS"
      homepage.weight: "60"
      caddy: "${PIHOLE_SITES}"
      caddy.log: access
      caddy.reverse_proxy: "127.0.0.1:800"
    image: pihole/pihole:latest
    restart: unless-stopped
    healthcheck:
      interval: 60s
    network_mode: host # listens to dns on 530 and http on 800
    environment:
      TZ: ${TZ}
      FTLCONF_webserver_api_password: ${PIHOLE_FTLCONF_webserver_api_password}
      PIHOLE_UID: ${PUID}
      PIHOLE_GID: ${PGID}
      FTLCONF_misc_dnsmasq_lines: |-
        bind-interfaces
        listen-address=${SERVER_LAN_IP}
        listen-address=127.0.0.1
        listen-address=${SERVER_VPN_IP}
        address=/${DOMAIN_LAN}/${SERVER_LAN_IP}
        address=/${DOMAIN_VPN}/${SERVER_VPN_IP}
      FTLCONF_dns_upstreams: |-
        8.8.8.8
        8.8.4.4
        1.1.1.1
        1.0.0.1
        4.2.2.1
        9.9.9.11
      FTLCONF_dns_listeningMode: ALL
      FTLCONF_dns_domainNeeded: "true"
      FTLCONF_dns_piholePTR: HOSTNAME
      FTLCONF_webserver_port: "800"
      FTLCONF_ntp_ipv4_active: "false"
      FTLCONF_ntp_ipv6_active: "false"
      FTLCONF_ntp_sync_active: "false"
      FTLCONF_misc_nice: "-15"
      FTLCONF_misc_check_load: "false"
    volumes:
      - /mnt/sata_500/pihole:/etc/pihole
    cap_add:
      # See https://docs.pi-hole.net/docker/#note-on-capabilities
      # Required if you are using Pi-hole as your DHCP server, else not needed
      - NET_ADMIN
      # Required if you are using Pi-hole as your NTP client to be able to set the host's system time
      - SYS_TIME
      # Optional, if Pi-hole should get some more processing time
      - SYS_NICE

  postgres:
    build:
      context: .
      dockerfile: Postgres_pgvector_ru.Dockerfile
    container_name: postgres
    restart: unless-stopped
    shm_size: '4gb'
    ports:
      - 5432:5432
    environment:
      - TZ=${TZ}
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=postgres
    volumes:
      - /mnt/sata_500/dbs/postgres/data:/var/lib/postgresql
      - ./config/postgres:/etc/postgresql:ro
    command: -c config_file=/etc/postgresql/postgresql.conf
    networks:
      - default
      - backend


  valkey:
    image: valkey/valkey:9
    container_name: valkey
    restart: unless-stopped
    command: valkey-server --save 240 5 --loglevel warning
    shm_size: '4gb'
    ports:
      - 6379:6379
    environment:
      - TZ=${TZ}
    volumes:
      - /mnt/sata_500/dbs/valkey:/data
    networks:
      - default
      - backend

  cronicle:
    image: cronicle/edge
    container_name: cronicle
    labels:
      homepage.group: "Infra"
      homepage.name: "Cronicle"
      homepage.icon: "mdi-calendar-clock"
      homepage.href: "${CRONICLE_URL}"
      homepage.description: "Scheduled jobs"
      homepage.weight: "40"
      caddy: "${CRONICLE_SITES}"
      caddy.log: access
      caddy.reverse_proxy: "{{upstreams 3012}}"
      caddy_ingress_network: "proxy"
    hostname: manager1
    restart: unless-stopped
    command: ["manager"]
    extra_hosts:
      - "the-rock:192.168.50.137" # cronicle worker
    environment:
      - TZ=${TZ}
      - CRONICLE_manager=1
      - CRONICLE_secret_key=${CRONICLE_SECRET_KEY}
    volumes:
      - /mnt/sata_500/cronicle/data:/opt/cronicle/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/kloud:/home/kloud
      - /mnt/sata_500:/mnt/sata_500
    networks:
      - default
      - proxy

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - COLLECTIONS=crowdsecurity/caddy crowdsecurity/http-cve crowdsecurity/base-http-scenarios crowdsecurity/whitelist-good-actors
      - BOUNCER_KEY_caddy=${CROWDSEC_BOUNCER_KEY}
      - USE_WAL=true
    # Local API for Caddy's bouncer
    ports:
      - 127.0.0.1:8090:8080
    volumes:
      - /mnt/sata_500/crowdsec/data:/var/lib/crowdsec/data
      - /mnt/sata_500/crowdsec/config:/etc/crowdsec
      - ./config/crowdsec/acquis.yaml:/etc/crowdsec/acquis.d/caddy.yaml:ro
      - ./config/crowdsec/whitelist.yaml:/etc/crowdsec/parsers/s02-enrich/kloud-whitelist.yaml:ro
      - caddy-access:/var/log/caddy:ro

  backrest:
    image: garethgeorge/backrest:latest
    container_name: backrest
    hostname: microchelik # restic records it as the snapshots' host
    labels:
      homepage.group: "Infra"
      homepage.name: "Backrest"
      homepage.icon: "backrest.png"
      homepage.href: "${BACKREST_URL}"
      homepage.description: "Backups"
      homepage.weight: "90"
      caddy: "${BACKREST_SITES}"
      caddy.log: access
      caddy.reverse_proxy: "{{upstreams 9898}}"
      caddy_ingress_network: "proxy"
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - BACKREST_DATA=/data
      - BACKREST_CONFIG=/config/config.json
      - XDG_CACHE_HOME=/cache
      - TMPDIR=/tmp
    volumes:
      - /mnt/sata_500/backrest/data:/data
      - /mnt/sata_500/backrest/config:/config
      - /mnt/sata_500/backrest/cache:/cache
      - /mnt/sata_500/backrest/ssh:/root/.ssh # keys for SFTP repos
      - /mnt/sata_500/backrest/restore:/restore
      # Same path as on the host, so snapshots show the real paths
      - /mnt/sata_500:/mnt/sata_500:ro
      - nfs-ssd:/the-rock-ssd
    tmpfs:
      - /tmp:size=1g
    networks:
      - default
      - proxy

  authelia:
    image: authelia/authelia:4
    user: "${PUID}:${PGID}"
    container_name: authelia
    command: ["--config", "/etc/authelia/configuration.yml"]
    labels:
        caddy: "${AUTHELIA_URL}:443"
        caddy.log: access
        caddy.import: protect
        caddy.reverse_proxy: "{{upstreams 9091}}"
        caddy_ingress_network: "proxy"
    restart: unless-stopped
    healthcheck:
      interval: 60s
    environment:
      X_AUTHELIA_CONFIG_FILTERS: template
      AUTH_DOMAIN: ${AUTH_DOMAIN}
      AUTH_URL: ${AUTHELIA_URL}
      ATLAS_PUBLIC_URL: ${ATLAS_URL}
      AUTH_POLICY: ${AUTH_POLICY:-one_factor}
    networks:
      - default
      - proxy
    volumes:
      - /mnt/sata_500/authelia/configuration.yml:/etc/authelia/configuration.yml:ro
      - /mnt/sata_500/authelia/config:/config

  llamacpp:
    image: ghcr.io/mostlygeek/llama-swap:cpu
    # image: ghcr.io/ikawrakow/ik-llama-cpp:cpu-swap
    container_name: llamacpp
    restart: unless-stopped
    healthcheck:
      interval: 60s
    user: ${PUID}:${PGID}
    ports:
      - 127.0.0.1:9292:8080
    volumes:
      - /mnt/sata_500/llama.cpp:/models:ro
      - ./config/llamacpp/config.yaml:/app/config.yaml:ro
    networks:
      - default
      - backend

networks:
  proxy:
    name: proxy
  backend:
    name: backend

volumes:
  # Caddy access log, read by vector and crowdsec, written by caddy obv
  caddy-access:
    name: caddy-access
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=192m

  nfs-ssd:
    driver: local
    name: chonker-ssd
    driver_opts:
      type: nfs
      o: addr=${THE_ROCK_IP},rw,hard,async,noatime,nconnect=2,vers=4.1
      device: ":/mnt/ssd1"
