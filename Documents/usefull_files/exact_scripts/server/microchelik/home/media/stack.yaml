services:
    mpd-alsa:
        image: giof71/mpd-alsa
        container_name: mpd-alsa
        restart: unless-stopped
        environment:
            - TZ=${TZ}
            - ALSA_OUTPUT_CREATE=yes
        devices:
            - /dev/snd
        ports:
            - 6600:6600
        volumes:
            - chonker-music:/music:ro
            - /mnt/sata_500/mpd/playlists:/playlists
            - /mnt/sata_500/mpd/db:/db
            - /mnt/sata_500/mpd/userconf:/user/config
        tmpfs:
            - /log

    minidlna:
        image: vladgh/minidlna
        container_name: minidlna
        restart: unless-stopped
        healthcheck:
            interval: 60s
        network_mode: host
        environment:
            - PUID=${PUID}
            - PGID=${PGID}
            - TZ=${TZ}
            - MINIDLNA_MEDIA_DIR=/music
            - MINIDLNA_FRIENDLY_NAME=MikrochelikDl
            - MINIDLNA_NOTIFY_INTERVAL=30
            - MINIDLNA_INOTIFY=no
        volumes:
            - chonker-music:/music:ro
            - chonker-media:/media:ro


    navidrome:
        image: deluan/navidrome:latest
        container_name: navidrome
        labels:
          homepage.group: "Internal apps"
          homepage.name: "Navidrome"
          homepage.icon: "navidrome.png"
          homepage.href: "${NAVIDROME_URL}"
          homepage.description: "Music"
          homepage.weight: "20"
          caddy: "${NAVIDROME_SITES}"
          caddy.log: access
          caddy.reverse_proxy: "{{upstreams 4533}}"
          caddy_ingress_network: "proxy"
        user: ${PUID}:${PGID}
        restart: unless-stopped
        ports:
            - 4533:4533 # For external audiomuse worker
        environment:
            - ND_SCANNER_WATCHERWAIT=0            # disable the file watcher (useless over NFS)
            - ND_SCANNER_SCHEDULE=0 4 * * *       # nightly scan at 04:00
            - ND_SCANNER_SCANONSTARTUP=false      # no scan on container restart
            - ND_IMAGECACHESIZE=2GB               # keep more resized covers locally
            - ND_PLUGINS_ENABLED=true
            - ND_PLUGINS_AUTORELOAD=true
            - ND_AGENTS=audiomuseai,lastfm,deezer,listenbrainz
            - TZ=${TZ}
        volumes:
            - /mnt/sata_500/navidrome:/data
            - chonker-music:/music:ro
        networks:
          - default
          - proxy

    audiomuse-ai-flask:
        image: ghcr.io/neptunehub/audiomuse-ai:latest
        container_name: audiomuse-ai-flask
        restart: unless-stopped
        user: "${PUID}:${PGID}"
        labels:
            homepage.group: "Internal apps"
            homepage.name: "AudioMuse"
            homepage.icon: "mdi-music"
            homepage.href: "${AUDIOMUSE_URL}"
            homepage.description: "Music analyser"
            homepage.weight: "30"
            caddy: "${AUDIOMUSE_SITES}"
            caddy.log: access
            caddy.reverse_proxy: "{{upstreams 8000}}"
            caddy_ingress_network: proxy
        ports:
            # Temp, remove later
            - 11122:8000
        environment:
            - SERVICE_TYPE=flask
            - TZ=${TZ}
            - POSTGRES_HOST=postgres
            - POSTGRES_PORT=5432
            - POSTGRES_DB=audiomuse
            - POSTGRES_USER=audiomuse
            - POSTGRES_PASSWORD=${AUDIOMUSE_DB_PASSWORD}
            - TEMP_DIR=/app/temp_audio
            - IVF_DISK_CACHE_DIR=/cache/ivf
            - FLASK_HTTPS_CERT_DIR=/cache/tls
        volumes:
            - /mnt/sata_500/audiomuse/plugins-flask:/app/plugin/installed
            - /mnt/sata_500/audiomuse/tls:/cache/tls
        tmpfs:
            - /app/temp_audio:uid=${PUID},gid=${PGID},mode=0755,size=2147483648
            - /cache/ivf:uid=${PUID},gid=${PGID},mode=0755,size=134217728
        networks:
            - default
            - backend
            - proxy

    audiomuse-ai-worker:
        image: ghcr.io/neptunehub/audiomuse-ai:latest
        container_name: audiomuse-ai-worker
        restart: unless-stopped
        user: "${PUID}:${PGID}"
        environment:
            - SERVICE_TYPE=worker
            - TZ=${TZ}
            - POSTGRES_HOST=postgres
            - POSTGRES_PORT=5432
            - POSTGRES_DB=audiomuse
            - POSTGRES_USER=audiomuse
            - POSTGRES_PASSWORD=${AUDIOMUSE_DB_PASSWORD}
            - TEMP_DIR=/app/temp_audio
            - IVF_DISK_CACHE_DIR=/cache/ivf
            - CLAP_OTHER_FEATURES_CACHE_DIR=/tmp/clap
        volumes:
            - /mnt/sata_500/audiomuse/plugins-worker:/app/plugin/installed
        tmpfs:
            - /app/temp_audio:uid=${PUID},gid=${PGID},mode=0755,size=2147483648
            - /tmp/clap:uid=${PUID},gid=${PGID},mode=0755,size=134217728
            - /cache/ivf:uid=${PUID},gid=${PGID},mode=0755,size=134217728
        networks:
            - default
            - backend

    audiomuse-ai-worker-2:
        image: ghcr.io/neptunehub/audiomuse-ai:latest
        container_name: audiomuse-ai-worker-2
        restart: unless-stopped
        user: "${PUID}:${PGID}"
        environment:
            - SERVICE_TYPE=worker
            - TZ=${TZ}
            - POSTGRES_HOST=postgres
            - POSTGRES_PORT=5432
            - POSTGRES_DB=audiomuse
            - POSTGRES_USER=audiomuse
            - POSTGRES_PASSWORD=${AUDIOMUSE_DB_PASSWORD}
            - TEMP_DIR=/app/temp_audio
            - IVF_DISK_CACHE_DIR=/cache/ivf
            - CLAP_OTHER_FEATURES_CACHE_DIR=/tmp/clap
        volumes:
            - /mnt/sata_500/audiomuse/plugins-worker-2:/app/plugin/installed
        tmpfs:
            - /app/temp_audio:uid=${PUID},gid=${PGID},mode=0755,size=2147483648
            - /tmp/clap:uid=${PUID},gid=${PGID},mode=0755,size=134217728
            - /cache/ivf:uid=${PUID},gid=${PGID},mode=0755,size=134217728
        networks:
            - default
            - backend

    immich-server:
        image: ghcr.io/open-noodle/gallery-server:${IMMICH_VERSION}
        container_name: immich-server
        user: "${PUID}:${PGID}"
        restart: unless-stopped
        healthcheck:
            interval: 60s
        labels:
          caddy: "${GALLERY_URL}"
          caddy.import: protect
          caddy.log: access
          caddy.reverse_proxy: "{{upstreams 2283}}"
          caddy_ingress_network: "proxy"
        devices:
           - /dev/dri:/dev/dri
        group_add:
           - "481" # video group
           - "484" # render group
        volumes:
           - chonker-photos:/data
           - /mnt/sata_500/immich/thumbs:/data/thumbs
           - /mnt/sata_500/immich/encoded-video:/data/encoded-video
           - /etc/localtime:/etc/localtime:ro
        environment:
           - TZ=${TZ}
           - DB_HOSTNAME=${DB_HOSTNAME}
           - DB_USERNAME=${IMMICH_DB_USERNAME}
           - DB_PASSWORD=${IMMICH_DB_PASSWORD}
           - DB_DATABASE_NAME=${IMMICH_DB_DATABASE_NAME}
           - REDIS_HOSTNAME=valkey
           - REDIS_DBINDEX=5
        networks:
           - default
           - backend
           - proxy

    immich-machine-learning:
        image: ghcr.io/open-noodle/gallery-ml:${IMMICH_VERSION}
        container_name: immich-machine-learning
        user: "${PUID}:${PGID}"
        restart: unless-stopped
        healthcheck:
            interval: 60s
        environment:
            - TZ=${TZ}
        security_opt:
            - no-new-privileges=true
        cap_drop:
            - NET_RAW
        volumes:
            - /mnt/sata_500/immich/models:/cache
        networks:
            - default

    immich-power-tools-kloud:
        container_name: immich-power-tools-kloud
        healthcheck:
            interval: 60s
        image: ghcr.io/immich-power-tools/immich-power-tools:latest
        user: "${PUID}:${PGID}"
        labels:
            caddy: "${GALLERY_TOOLS_SITES}"
            caddy.log: access
            caddy.reverse_proxy: "{{upstreams 3000}}"
            caddy_ingress_network: proxy
        volumes:
            - /mnt/sata_500/immich/powertools-kloud:/app/data
        environment:
            - DB_HOST=${DB_HOSTNAME}
            - DB_PORT=5432
            - DB_USERNAME=${IMMICH_DB_USERNAME}
            - DB_PASSWORD=${IMMICH_DB_PASSWORD}
            - DB_DATABASE_NAME=${IMMICH_DB_DATABASE_NAME}
            - IMMICH_API_KEY=${KLOUD_IMMICH_API_KEY}
            - IMMICH_URL=http://immich-server:2283
            - EXTERNAL_IMMICH_URL=${GALLERY_URL}
            - AI_BASE_URL=http://llamacpp:8080/v1
            - AI_MODEL=qwen3.5-4b
            - AI_API_KEY=none # required, llama-swap has no auth
        networks:
            - default
            - backend
            - proxy



networks:
  proxy:
    external: true
    name: proxy
  backend:
    external: true
    name: backend

volumes:
  chonker-music:
    driver: local
    name: chonker-music
    driver_opts:
      type: nfs
      o: addr=${THE_ROCK_IP},rw,hard,async,noatime,nconnect=2,vers=4.1,fsc
      device: ":/mnt/chonker/music"

  chonker-photos:
    driver: local
    name: chonker-photos
    driver_opts:
      type: nfs
      o: addr=${THE_ROCK_IP},rw,hard,async,noatime,nconnect=2,vers=4.1,fsc
      device: ":/mnt/chonker/photos"

  chonker-media:
    driver: local
    name: chonker-media
    driver_opts:
      type: nfs
      o: addr=${THE_ROCK_IP},rw,hard,async,noatime,nconnect=2,vers=4.1
      device: ":/mnt/chonker/media"
