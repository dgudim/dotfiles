services:
    mpd-alsa:
        image: giof71/mpd-alsa
        container_name: mpd-alsa
        restart: unless-stopped
        environment:
            - TZ=${TZ}
            - ALSA_OUTPUT_CREATE=yes
        devices:
            - /dev/snd
        ports:
            - 6600:6600
        volumes:
            - chonker-music:/music:ro
            - /mnt/sata_500/mpd/playlists:/playlists
            - /mnt/sata_500/mpd/db:/db
            - /mnt/sata_500/mpd/userconf:/user/config
        tmpfs:
            - /log

    minidlna:
        image: vladgh/minidlna
        container_name: minidlna
        restart: unless-stopped
        healthcheck:
            interval: 60s
        network_mode: host
        environment:
            - PUID=${PUID}
            - PGID=${PGID}
            - TZ=${TZ}
            - MINIDLNA_MEDIA_DIR=/music
            - MINIDLNA_FRIENDLY_NAME=MikrochelikDl
            - MINIDLNA_NOTIFY_INTERVAL=30
            - MINIDLNA_INOTIFY=no
        volumes:
            - chonker-music:/music:ro
            - chonker-media:/media:ro


    navidrome:
        image: deluan/navidrome:latest
        container_name: navidrome
        labels:
          homepage.group: "Internal apps"
          homepage.name: "Navidrome"
          homepage.icon: "navidrome.png"
          homepage.href: "${NAVIDROME_URL}"
          homepage.description: "Music"
          homepage.weight: "20"
          caddy: "${NAVIDROME_SITES}"
          caddy.log: access
          caddy.reverse_proxy: "{{upstreams 4533}}"
          caddy_ingress_network: "proxy"
          backup.stop: ""
          backup.stop-order: "0"
        user: ${PUID}:${PGID}
        restart: unless-stopped
        ports:
            - 4533:4533 # For external audiomuse worker
        environment:
            - ND_SCANNER_WATCHERWAIT=0            # disable the file watcher (useless over NFS)
            - ND_SCANNER_SCHEDULE=0 4 * * *       # nightly scan at 04:00
            - ND_SCANNER_SCANONSTARTUP=false      # no scan on container restart
            - ND_IMAGECACHESIZE=2GB               # keep more resized covers locally
            - ND_PLUGINS_ENABLED=true
            - ND_PLUGINS_AUTORELOAD=true
            - ND_AGENTS=audiomuseai,apple-music,lastfm,deezer,listenbrainz
            - ND_LYRICSPRIORITY=.lrc,.txt,embedded,nd-lyrics,navidrome-shazam-plugin  # plugin lyrics show in Feishin, not Navidrome's UI
            - ND_SESSIONTIMEOUT=72h
            - ND_LASTFM_APIKEY=${LASTFM_API_KEY}
            - ND_LASTFM_SECRET=${LASTFM_API_SECRET}
            - TZ=${TZ}
        volumes:
            - /mnt/sata_500/navidrome:/data
            - chonker-music:/music   # writable so the lyrics plugin can save sidecar files
        networks:
          - default
          - proxy


    feishin:
        image: ghcr.io/jeffvli/feishin:latest
        container_name: feishin
        restart: unless-stopped
        labels:
          homepage.group: "Internal apps"
          homepage.name: "Feishin"
          homepage.icon: "feishin.png"
          homepage.href: "${FEISHIN_URL}"
          homepage.description: "Music player"
          homepage.weight: "21"
          caddy: "${FEISHIN_SITES}"
          caddy.log: access
          caddy.reverse_proxy: "{{upstreams 9180}}"
          caddy_ingress_network: "proxy"
        environment:
            - SERVER_NAME=Navidrome
            - SERVER_TYPE=navidrome
            - SERVER_URL=${NAVIDROME_URL}
            - SERVER_LOCK=false
            - LEGACY_AUTHENTICATION=false
            - ANALYTICS_DISABLED=true
        networks:
          - default
          - proxy

    navisync:
        build:
            context: .
            dockerfile: NaviSync.Dockerfile
        container_name: navisync
        profiles: ["manual"]
        user: ${PUID}:${PGID}
        environment:
            - TZ=${TZ}
            - NAVIDROME_DB_PATH=/navidrome/navidrome.db
            - NAVIDROME_URL=http://navidrome:4533
            - NAVIDROME_USER_ID=49pOG1LxG2H1YZJ5llfFDH
            - LASTFM_USER=${LASTFM_USER}
            - LASTFM_API_KEY=${LASTFM_API_KEY}
            - LASTFM_API_SECRET=${LASTFM_API_SECRET}
            - LASTFM_SESSION_KEY=${LASTFM_SESSION_KEY}
            - SYNC_LOVED_TO_LASTFM=True
            - SYNC_PLAYCOUNT=True
            - PLAYCOUNT_CONFLICT_RESOLUTION=higher
            - ALBUM_MATCHING_MODE=album_aware
            - DUPLICATE_RESOLUTION=all
            - AUTO_CONFIRM=True
            - ENABLE_FUZZY_MATCHING=True
            - FUZZY_MATCHING_THRESHOLD=90
            - FUZZY_MATCHING_AUTO_THRESHOLD=90
            - SPINDLE_URL=http://spindle-backend:3590   # after each sync, send recent plays from Navidrome's history to Spindle
            - SPINDLE_INGEST_SECRET=${SPINDLE_INGEST_SECRET}
        volumes:
            - /mnt/sata_500/navidrome:/navidrome
            - /mnt/sata_500/navisync:/state      # match cache and reports
            - ./config/navisync/navisync_unattended.py:/app/navisync_unattended.py:ro   # edits apply without a rebuild
        networks:
            - default

    spindle-backend:
        image: ghcr.io/xmorose/spindle:latest
        container_name: spindle-backend
        restart: unless-stopped
        user: ${PUID}:${PGID}
        labels:
            homepage.group: "Internal apps"
            homepage.name: "Spindle"
            homepage.icon: "mdi-chart-timeline-variant"
            homepage.href: "${SPINDLE_URL}"
            homepage.description: "Listening stats"
            homepage.weight: "22"
            caddy: "${SPINDLE_SITES}"
            caddy.log: access
            caddy.reverse_proxy: "{{upstreams 3590}}"
            caddy_ingress_network: "proxy"
        environment:
            - TZ=${TZ}
            - WEB_DIR=/app/web
            - STATS_DB_PATH=/app/data/stats.db
            - COVER_CACHE_DIR=/app/data/covers
            - NAVIDROME_DB_PATH=/nddata/navidrome.db
            - DEFAULT_USER=kloud
            - INGEST_SECRET=${SPINDLE_INGEST_SECRET}
            - AUTH_ENABLED=false
            - TRUST_PROXY=true
            - NAVIDROME_URL=http://navidrome:4533
            - NAVIDROME_USER=${SPINDLE_NAVIDROME_USER}
            - NAVIDROME_PASSWORD=${SPINDLE_NAVIDROME_PASSWORD}
            - EXCLUDE_BASELINE_WHEN_IMPORTED=true
        volumes:
            - /mnt/sata_500/spindle:/app/data
            - /mnt/sata_500/navidrome:/nddata
        networks:
            - default
            - proxy

    audiomuse-ai-flask:
        image: ghcr.io/neptunehub/audiomuse-ai:latest
        container_name: audiomuse-ai-flask
        restart: unless-stopped
        user: "${PUID}:${PGID}"
        labels:
            homepage.group: "Internal apps"
            homepage.name: "AudioMuse"
            homepage.icon: "mdi-music"
            homepage.href: "${AUDIOMUSE_URL}"
            homepage.description: "Music analyser"
            homepage.weight: "30"
            caddy: "${AUDIOMUSE_SITES}"
            caddy.log: access
            caddy.reverse_proxy: "{{upstreams 8000}}"
            caddy_ingress_network: proxy
        ports:
            # Temp, remove later
            - 11122:8000
        environment:
            - SERVICE_TYPE=flask
            - TZ=${TZ}
            - POSTGRES_HOST=postgres
            - POSTGRES_PORT=5432
            - POSTGRES_DB=audiomuse
            - POSTGRES_USER=audiomuse
            - POSTGRES_PASSWORD=${AUDIOMUSE_DB_PASSWORD}
            - TEMP_DIR=/app/temp_audio
            - IVF_DISK_CACHE_DIR=/cache/ivf
            - FLASK_HTTPS_CERT_DIR=/cache/tls
        volumes:
            - /mnt/sata_500/audiomuse/plugins-flask:/app/plugin/installed
            - /mnt/sata_500/audiomuse/tls:/cache/tls
        tmpfs:
            - /app/temp_audio:uid=${PUID},gid=${PGID},mode=0755,size=2147483648
            - /cache/ivf:uid=${PUID},gid=${PGID},mode=0755,size=134217728
        networks:
            - default
            - backend
            - proxy

    audiomuse-ai-worker:
        image: ghcr.io/neptunehub/audiomuse-ai:latest
        container_name: audiomuse-ai-worker
        restart: unless-stopped
        user: "${PUID}:${PGID}"
        environment:
            - SERVICE_TYPE=worker
            - TZ=${TZ}
            - POSTGRES_HOST=postgres
            - POSTGRES_PORT=5432
            - POSTGRES_DB=audiomuse
            - POSTGRES_USER=audiomuse
            - POSTGRES_PASSWORD=${AUDIOMUSE_DB_PASSWORD}
            - TEMP_DIR=/app/temp_audio
            - IVF_DISK_CACHE_DIR=/cache/ivf
            - CLAP_OTHER_FEATURES_CACHE_DIR=/tmp/clap
        volumes:
            - /mnt/sata_500/audiomuse/plugins-worker:/app/plugin/installed
        tmpfs:
            - /app/temp_audio:uid=${PUID},gid=${PGID},mode=0755,size=2147483648
            - /tmp/clap:uid=${PUID},gid=${PGID},mode=0755,size=134217728
            - /cache/ivf:uid=${PUID},gid=${PGID},mode=0755,size=134217728
        networks:
            - default
            - backend

    audiomuse-ai-worker-2:
        image: ghcr.io/neptunehub/audiomuse-ai:latest
        container_name: audiomuse-ai-worker-2
        restart: unless-stopped
        user: "${PUID}:${PGID}"
        environment:
            - SERVICE_TYPE=worker
            - TZ=${TZ}
            - POSTGRES_HOST=postgres
            - POSTGRES_PORT=5432
            - POSTGRES_DB=audiomuse
            - POSTGRES_USER=audiomuse
            - POSTGRES_PASSWORD=${AUDIOMUSE_DB_PASSWORD}
            - TEMP_DIR=/app/temp_audio
            - IVF_DISK_CACHE_DIR=/cache/ivf
            - CLAP_OTHER_FEATURES_CACHE_DIR=/tmp/clap
        volumes:
            - /mnt/sata_500/audiomuse/plugins-worker-2:/app/plugin/installed
        tmpfs:
            - /app/temp_audio:uid=${PUID},gid=${PGID},mode=0755,size=2147483648
            - /tmp/clap:uid=${PUID},gid=${PGID},mode=0755,size=134217728
            - /cache/ivf:uid=${PUID},gid=${PGID},mode=0755,size=134217728
        networks:
            - default
            - backend

    immich-server:
        image: ghcr.io/gudim/gallery-server:${IMMICH_VERSION}
        container_name: immich-server
        user: "${PUID}:${PGID}"
        restart: unless-stopped
        healthcheck:
            interval: 60s
        labels:
          caddy: "${GALLERY_URL}"
          caddy.import: protect
          caddy.log: access
          caddy.reverse_proxy: "{{upstreams 2283}}"
          caddy_ingress_network: "proxy"
          backup.stop: ""
          backup.stop-priority: "0"
        devices:
           - /dev/dri:/dev/dri
        group_add:
           - "481" # video group
           - "484" # render group
        volumes:
           - chonker-photos:/data
           - /mnt/sata_500/immich/thumbs:/data/thumbs
           - /mnt/sata_500/immich/encoded-video:/data/encoded-video
           - /etc/localtime:/etc/localtime:ro
        environment:
           - TZ=${TZ}
           - DB_HOSTNAME=${DB_HOSTNAME}
           - DB_USERNAME=${IMMICH_DB_USERNAME}
           - DB_PASSWORD=${IMMICH_DB_PASSWORD}
           - DB_DATABASE_NAME=${IMMICH_DB_DATABASE_NAME}
           - TRIPS_LLM_SECRET=${TRIPS_LLM_SECRET}
           - REDIS_HOSTNAME=valkey
           - REDIS_DBINDEX=5
        networks:
           - default
           - backend
           - proxy

    immich-machine-learning:
        image: ghcr.io/open-noodle/gallery-ml:${IMMICH_ML_VERSION}
        container_name: immich-machine-learning
        user: "${PUID}:${PGID}"
        restart: unless-stopped
        healthcheck:
            interval: 60s
        environment:
            - TZ=${TZ}
        security_opt:
            - no-new-privileges=true
        cap_drop:
            - NET_RAW
        volumes:
            - /mnt/sata_500/immich/models:/cache
        networks:
            - default

    immich-power-tools-kloud:
        container_name: immich-power-tools-kloud
        healthcheck:
            interval: 60s
        image: ghcr.io/immich-power-tools/immich-power-tools:latest
        user: "${PUID}:${PGID}"
        labels:
            caddy: "${GALLERY_TOOLS_SITES}"
            caddy.log: access
            caddy.reverse_proxy: "{{upstreams 3000}}"
            caddy_ingress_network: proxy
        volumes:
            - /mnt/sata_500/immich/powertools-kloud:/app/data
        environment:
            - DB_HOST=${DB_HOSTNAME}
            - DB_PORT=5432
            - DB_USERNAME=${IMMICH_DB_USERNAME}
            - DB_PASSWORD=${IMMICH_DB_PASSWORD}
            - DB_DATABASE_NAME=${IMMICH_DB_DATABASE_NAME}
            - IMMICH_API_KEY=${KLOUD_IMMICH_API_KEY}
            - IMMICH_URL=http://immich-server:2283
            - EXTERNAL_IMMICH_URL=${GALLERY_URL}
            - AI_BASE_URL=http://llamacpp:8080/v1
            - AI_MODEL=qwen3.5-4b
            - AI_API_KEY=none # required, llama-swap has no auth
        networks:
            - default
            - backend
            - proxy



networks:
  proxy:
    external: true
    name: proxy
  backend:
    external: true
    name: backend

volumes:
  chonker-music:
    driver: local
    name: chonker-music
    driver_opts:
      type: nfs
      o: addr=${THE_ROCK_IP},rw,hard,async,noatime,nconnect=2,vers=4.1,fsc
      device: ":/mnt/chonker/music"

  chonker-photos:
    driver: local
    name: chonker-photos
    driver_opts:
      type: nfs
      o: addr=${THE_ROCK_IP},rw,hard,async,noatime,nconnect=2,vers=4.1,fsc
      device: ":/mnt/chonker/photos"

  chonker-media:
    driver: local
    name: chonker-media
    driver_opts:
      type: nfs
      o: addr=${THE_ROCK_IP},rw,hard,async,noatime,nconnect=2,vers=4.1
      device: ":/mnt/chonker/media"
