name: media
services:
    mpd-alsa:
        image: giof71/mpd-alsa
        container_name: mpd-alsa
        restart: unless-stopped
        environment:
            - TZ=Europe/Vilnius
            - ALSA_OUTPUT_CREATE=yes
        devices:
            - /dev/snd
        ports:
            - 6600:6600
        volumes:
            - chonker-music:/music:ro
            - /mnt/sata_500/mpd/playlists:/playlists
            - /mnt/sata_500/mpd/db:/db
            - /mnt/sata_500/mpd/userconf:/user/config
        tmpfs:
            - /log

    minidlna:
        image: vladgh/minidlna
        container_name: minidlna
        restart: unless-stopped
        network_mode: host
        environment:
            - PUID=1000
            - PGID=100
            - TZ=Europe/Vilnius
            - MINIDLNA_MEDIA_DIR=/music
            - MINIDLNA_FRIENDLY_NAME=MikrochelikDl
            - MINIDLNA_NOTIFY_INTERVAL=30
            - MINIDLNA_INOTIFY=no
        volumes:
            - chonker-music:/music:ro
            - chonker-media:/media:ro


    navidrome:
        image: deluan/navidrome:latest
        container_name: navidrome
        labels:
          caddy: "http://navidrome.kloud.home, http://navidrome.kloud.vpn"
          caddy.log: access
          caddy.reverse_proxy: "{{upstreams 4533}}"
          caddy_ingress_network: "proxy"
        user: 1000:100
        restart: unless-stopped
        ports:
            - 4533:4533 # For external audiomuse worker
        environment:
            - ND_SCANNER_WATCHERWAIT=0            # disable the file watcher (useless over NFS)
            - ND_SCANNER_SCHEDULE=0 4 * * *       # nightly scan at 04:00
            - ND_SCANNER_SCANONSTARTUP=false      # no scan on container restart
            - ND_IMAGECACHESIZE=2GB               # keep more resized covers locally
            - ND_PLUGINS_ENABLED=true
            - ND_PLUGINS_AUTORELOAD=true
            - ND_AGENTS=audiomuseai,lastfm,deezer,listenbrainz
            - TZ=Europe/Vilnius
        volumes:
            - /mnt/sata_500/navidrome:/data
            - chonker-music:/music:ro
        networks:
          - default
          - proxy

    audiomuse-ai-flask:
        image: ghcr.io/neptunehub/audiomuse-ai:latest
        container_name: audiomuse-ai-flask
        restart: unless-stopped
        user: "1000:100"
        labels:
            caddy: "http://audiomuse.kloud.home, http://audiomuse.kloud.vpn"
            caddy.reverse_proxy: "{{upstreams 8000}}"
            caddy_ingress_network: proxy
        ports:
            # Temp, remove later
            - 11122:8000
        environment:
            - SERVICE_TYPE=flask
            - TZ=Europe/Vilnius
            - POSTGRES_HOST=postgres
            - POSTGRES_PORT=5432
            - POSTGRES_DB=audiomuse
            - POSTGRES_USER=audiomuse
            - POSTGRES_PASSWORD=${AUDIOMUSE_DB_PASSWORD}
            - TEMP_DIR=/app/temp_audio
            - IVF_DISK_CACHE_DIR=/cache/ivf
            - FLASK_HTTPS_CERT_DIR=/cache/tls
        volumes:
            - /mnt/sata_500/audiomuse/plugins-flask:/app/plugin/installed
            - /mnt/sata_500/audiomuse/tls:/cache/tls
        tmpfs:
            - /app/temp_audio:uid=1000,gid=100,mode=0755,size=2147483648
            - /cache/ivf:uid=1000,gid=100,mode=0755,size=134217728
        networks:
            - default
            - backend
            - proxy

    audiomuse-ai-worker:
        image: ghcr.io/neptunehub/audiomuse-ai:latest
        container_name: audiomuse-ai-worker
        restart: unless-stopped
        user: "1000:100"
        environment:
            - SERVICE_TYPE=worker
            - TZ=Europe/Vilnius
            - POSTGRES_HOST=postgres
            - POSTGRES_PORT=5432
            - POSTGRES_DB=audiomuse
            - POSTGRES_USER=audiomuse
            - POSTGRES_PASSWORD=${AUDIOMUSE_DB_PASSWORD}
            - TEMP_DIR=/app/temp_audio
            - IVF_DISK_CACHE_DIR=/cache/ivf
            - CLAP_OTHER_FEATURES_CACHE_DIR=/tmp/clap
        volumes:
            - /mnt/sata_500/audiomuse/plugins-worker:/app/plugin/installed
        tmpfs:
            - /app/temp_audio:uid=1000,gid=100,mode=0755,size=2147483648
            - /tmp/clap:uid=1000,gid=100,mode=0755,size=134217728
            - /cache/ivf:uid=1000,gid=100,mode=0755,size=134217728
        networks:
            - default
            - backend

    audiomuse-ai-worker-2:
        image: ghcr.io/neptunehub/audiomuse-ai:latest
        container_name: audiomuse-ai-worker-2
        restart: unless-stopped
        user: "1000:100"
        environment:
            - SERVICE_TYPE=worker
            - TZ=Europe/Vilnius
            - POSTGRES_HOST=postgres
            - POSTGRES_PORT=5432
            - POSTGRES_DB=audiomuse
            - POSTGRES_USER=audiomuse
            - POSTGRES_PASSWORD=${AUDIOMUSE_DB_PASSWORD}
            - TEMP_DIR=/app/temp_audio
            - IVF_DISK_CACHE_DIR=/cache/ivf
            - CLAP_OTHER_FEATURES_CACHE_DIR=/tmp/clap
        volumes:
            - /mnt/sata_500/audiomuse/plugins-worker-2:/app/plugin/installed
        tmpfs:
            - /app/temp_audio:uid=1000,gid=100,mode=0755,size=2147483648
            - /tmp/clap:uid=1000,gid=100,mode=0755,size=134217728
            - /cache/ivf:uid=1000,gid=100,mode=0755,size=134217728
        networks:
            - default
            - backend

    immich-server:
        image: ghcr.io/open-noodle/gallery-server:${IMMICH_VERSION}
        container_name: immich-server
        user: "1000:100"
        restart: unless-stopped
        labels:
          caddy: "https://photos.kloud.home.kg"
          caddy.shield: ""
          caddy.log: access
          caddy.reverse_proxy: "{{upstreams 2283}}"
          caddy_ingress_network: "proxy"
        devices:
           - /dev/dri:/dev/dri
        group_add:
           - "481" # video group
           - "484" # render group
        volumes:
           - chonker-photos:/data
           - /mnt/sata_500/immich/thumbs:/data/thumbs
           - /mnt/sata_500/immich/encoded-video:/data/encoded-video
           - /etc/localtime:/etc/localtime:ro
        environment:
           - TZ=Europe/Vilnius
           - DB_HOSTNAME=${DB_HOSTNAME}
           - DB_USERNAME=${IMMICH_DB_USERNAME}
           - DB_PASSWORD=${IMMICH_DB_PASSWORD}
           - DB_DATABASE_NAME=${IMMICH_DB_DATABASE_NAME}
           - REDIS_HOSTNAME=${REDIS_HOSTNAME}
           - REDIS_DBINDEX=${IMMICH_REDIS_DBINDEX}
        networks:
           - default
           - backend
           - proxy

    immich-machine-learning:
        image: ghcr.io/open-noodle/gallery-ml:${IMMICH_VERSION}
        container_name: immich-machine-learning
        user: "1000:100"
        restart: unless-stopped
        environment:
            - TZ=Europe/Vilnius
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - NET_RAW
        volumes:
            - /mnt/sata_500/immich/models:/cache
        networks:
            - default

    immich-power-tools-kloud:
        container_name: immich-power-tools-kloud
        image: ghcr.io/immich-power-tools/immich-power-tools:latest
        user: "1000:100"
        labels:
            caddy: "http://photo-tools-kloud.kloud.home, http://photo-tools-kloud.kloud.vpn"
            caddy.reverse_proxy: "{{upstreams 3000}}"
            caddy_ingress_network: proxy
        volumes:
            - /mnt/sata_500/immich/powertools-kloud:/app/data
        environment:
            - DB_HOST=${DB_HOSTNAME}
            - DB_PORT=${DB_PORT}
            - DB_USERNAME=${IMMICH_DB_USERNAME}
            - DB_PASSWORD=${IMMICH_DB_PASSWORD}
            - DB_DATABASE_NAME=${IMMICH_DB_DATABASE_NAME}
            - IMMICH_API_KEY=${KLOUD_IMMICH_API_KEY}
            - IMMICH_URL=${IMMICH_URL}
            - EXTERNAL_IMMICH_URL=${EXTERNAL_IMMICH_URL}
        networks:
            - default
            - backend
            - proxy



networks:
  proxy:
    external: true
    name: proxy
  backend:
    external: true
    name: backend

volumes:
  chonker-music:
    driver: local
    name: chonker-music
    driver_opts:
      type: nfs
      o: addr=192.168.50.137,rw,hard,async,noatime,nconnect=2,vers=4.1,fsc
      device: ":/mnt/chonker/music"

  chonker-photos:
    driver: local
    name: chonker-photos
    driver_opts:
      type: nfs
      o: addr=192.168.50.137,rw,hard,async,noatime,nconnect=2,vers=4.1,fsc
      device: ":/mnt/chonker/photos"

  chonker-media:
    driver: local
    name: chonker-media
    driver_opts:
      type: nfs
      o: addr=192.168.50.137,rw,hard,async,noatime,nconnect=2,vers=4.1
      device: ":/mnt/chonker/media"
