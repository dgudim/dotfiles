# Replaces the stock postgres_db_transactions_rollback_ratio (warns above 2% over 5 minutes)
template: postgres_db_rollback_ratio_high
      on: postgres.db_transactions_ratio
   class: Errors
    type: Database
component: PostgreSQL
  lookup: average -15m unaligned of rollback
   units: %
   every: 1m
    warn: $this > (($status >= $WARNING) ? (5) : (10))
   delay: down 30m multiplier 1.5 max 2h
 summary: PostgreSQL DB ${label:database} aborted transactions
    info: Average aborted transactions percentage in db ${label:database} over the last 15 minutes
      to: dba
