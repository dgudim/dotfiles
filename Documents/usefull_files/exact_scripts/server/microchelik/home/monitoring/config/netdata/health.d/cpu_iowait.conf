 alarm: cpu_iowait_high
    on: system.cpu
lookup: average -5m unaligned of iowait
 units: %
 every: 1m
  warn: $this > (($status >= $WARNING) ? (40) : (50))
  crit: $this > (($status == $CRITICAL) ? (65) : (75))
 delay: down 5m multiplier 1.5 max 1h
summary: CPU iowait is high
  info: Average CPU iowait over the last 5 minutes
    to: sysadmin
