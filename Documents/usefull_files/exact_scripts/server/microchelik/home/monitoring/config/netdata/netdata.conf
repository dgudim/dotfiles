# Metric samples stay in RAM. Victoria Metrics keeps the scraped history.
[plugins]
    charts.d = no
    scripts.d = no

[plugin:proc]
    /proc/pressure = no

[db]
    db = ram
    retention = 1800

[ml]
    enabled = no

[global]
    update every = 15

[health]
    enabled alarms = !docker_container_unhealthy !used_swap !postgres_db_transactions_rollback_ratio *
