services:
    home-assistant:
        image: ghcr.io/home-assistant/home-assistant:stable
        container_name: homeassistant
        labels:
          homepage.group: "Home"
          homepage.name: "Home Assistant"
          homepage.icon: "home-assistant.png"
          homepage.href: "${HASS_URL}"
          homepage.description: "House controls"
          homepage.weight: "10"
          caddy: "${HASS_SITES}"
          caddy.log: access
          caddy.reverse_proxy: "127.0.0.1:8123"
        restart: unless-stopped
        # the recorder needs time to flush to the database on shutdown
        stop_grace_period: 2m
        network_mode: host
        environment:
            - TZ=${TZ}
            - HA_DISABLE_LOG_FILE=1
            # recorder, read by db_url: !env_var RECORDER_DB_URL in configuration.yaml
            - RECORDER_DB_URL=postgresql://homeassistant:${HASS_DB_PASS}@127.0.0.1:5432/homeassistant
        devices:
            - /dev/ttyACM0
            - /dev/ttyUSB0
        cap_add:
            - NET_ADMIN
            - NET_RAW # For bluetooth
        volumes:
            - /mnt/sata_500/hass_config:/config
            - /run/dbus:/run/dbus:ro
            - /dev/bus/usb:/dev/bus/usb

    esphome:
        image: ghcr.io/esphome/esphome
        container_name: esphome
        labels:
          homepage.group: "Home"
          homepage.name: "ESPHome"
          homepage.icon: "esphome.png"
          homepage.href: "${ESPHOME_URL}"
          homepage.description: "Device builder"
          homepage.weight: "20"
          caddy: "${ESPHOME_SITES}"
          caddy.log: access
          caddy.reverse_proxy: "127.0.0.1:6052"
        user: ${PUID}:${PGID}
        restart: unless-stopped
        healthcheck:
            interval: 60s
        network_mode: host
        environment:
            - PLATFORMIO_CORE_DIR=.platformio
            - PLATFORMIO_GLOBALLIB_DIR=.platformioLibs
            - TZ=${TZ}
        volumes:
            - /mnt/sata_500/hass_config/esphome:/config
            - /mnt/sata_500/hass_config/esphome/.cache:/.cache

    piper:
        image: rhasspy/wyoming-piper
        container_name: piper
        user: ${PUID}:${PGID}
        restart: unless-stopped
        healthcheck:
            interval: 60s
        command: --voice en_US-glados-medium
        environment:
            - TZ=${TZ}
        ports:
            - 127.0.0.1:10200:10200
        volumes:
            - /mnt/sata_500/piper:/data
    
    whisper:
      container_name: whisper
      image: rhasspy/wyoming-whisper
      user: ${PUID}:${PGID}
      restart: unless-stopped
      healthcheck:
          interval: 60s
      command: --model base-int8 --language en
      environment:
        - TZ=${TZ}
      ports:
        - 127.0.0.1:10300:10300
      volumes:
        - /mnt/sata_500/whisper/data:/data
        - /mnt/sata_500/whisper/cache:/.cache

    openwakeword:
      image: rhasspy/wyoming-openwakeword:latest
      container_name: openwakeword
      user: ${PUID}:${PGID}
      restart: unless-stopped
      # set that threshold to higher than 0.5 (ex 0.75) for more accurate but less sensitive wake word detection
      command: --custom-model-dir /custom --preload-model 'glados' --threshold 0.75
      environment:
        - TZ=${TZ}
      ports:
        - 127.0.0.1:10400:10400
      volumes:
        - /mnt/sata_500/openwakeword/data:/data
        - /mnt/sata_500/openwakeword/custom:/custom

    mosquitto:
      image: eclipse-mosquitto
      container_name: mosquitto
      restart: unless-stopped
      user: ${PUID}:${PGID}
      volumes:
        - ./config/mosquitto:/mosquitto/config:ro
        - /mnt/sata_500/mosquitto/data:/mosquitto/data # Don't remove, shadows the anon volume declared in the image
      tmpfs:
        - /mosquitto/log
      ports:
        - 1883:1883
        - 9001:9001

    power-mqtt:
      build:
        context: .
        dockerfile_inline: |
          FROM python:3.13-slim
          RUN pip install --no-cache-dir paho-mqtt
      container_name: power-mqtt
      network_mode: host
      restart: unless-stopped
      user: '${PUID}:${PGID}'
      environment:
        - TZ=${TZ}
        - MQTT_HOST=127.0.0.1
        - MQTT_PORT=1883
        - MQTT_USER=
        - MQTT_PASSWORD=${MQTT_PASSWORD}
      volumes:
        - /home/kloud/hass/power-mqtt.py:/app/power-mqtt.py:ro
      command: ["python", "-u", "/app/power-mqtt.py"]

