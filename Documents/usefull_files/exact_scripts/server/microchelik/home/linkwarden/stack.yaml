services:
  linkwarden:
    container_name: linkwarden
    labels:
      homepage.group: "Public"
      homepage.name: "Linkwarden"
      homepage.icon: "linkwarden.png"
      homepage.href: "${LINKWARDEN_URL}"
      homepage.description: "Bookmarks"
      homepage.weight: "20"
      caddy: "${LINKWARDEN_URL}"
      caddy.shield: ""
      caddy.log: access
      caddy.reverse_proxy: "{{upstreams 3000}}"
      caddy_ingress_network: "proxy"
    image: ghcr.io/linkwarden/linkwarden:latest
    restart: unless-stopped
    networks:
      - default
      - backend
      - proxy
    user: ${PUID}:${PGID}
    environment:
      NEXTAUTH_URL: "${LINKWARDEN_URL}/api/v1/auth"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      NEXT_PUBLIC_OLLAMA_ENDPOINT_URL: "http://host.docker.internal:11434"
      OLLAMA_MODEL: "phi3:mini-4k"
    volumes:
      - /mnt/sata_500/linkwarden/data:/data/data
    depends_on:
      - meilisearch

  meilisearch:
    image: getmeili/meilisearch:v1.12.8
    restart: unless-stopped
    user: ${PUID}:${PGID}
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    volumes:
      - /mnt/sata_500/linkwarden/meili_data:/meili_data

networks:
  proxy:
    external: true
    name: proxy
  backend:
    external: true
    name: backend
